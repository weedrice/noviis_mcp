name: Verify and Deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install locked build tools
        run: python -m pip install --require-hashes -r requirements-build.lock
      - name: Build and test the offline release bundle
        run: python scripts/build_release.py --revision "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release
          path: |
            dist/release.tgz
            dist/release.tgz.sha256
          if-no-files-found: error

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      ARCHIVE_PATH: /tmp/noviis-mcp-${{ github.run_id }}-${{ github.run_attempt }}.tgz
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/noviis-mcp' }}
      SERVICE_NAME: ${{ secrets.DEPLOY_SERVICE_NAME || 'noviis-mcp.service' }}
      HEALTH_URL: ${{ secrets.DEPLOY_HEALTH_URL || 'http://127.0.0.1:8001/mcp' }}
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: verified-release
          path: dist
      - name: Validate deploy secrets
        run: |
          test -n "$EC2_HOST"
          test -n "$EC2_USER"
          test -n "$EC2_SSH_KEY"
      - name: Verify downloaded archive
        working-directory: dist
        run: sha256sum --check release.tgz.sha256
      - name: Prepare SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$EC2_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$DEPLOY_PORT" "$EC2_HOST" >> ~/.ssh/known_hosts
      - name: Upload tested release archive
        run: scp -P "$DEPLOY_PORT" dist/release.tgz "$EC2_USER@$EC2_HOST:$ARCHIVE_PATH"
      - name: Run remote deploy without dependency resolution
        run: |
          ARCHIVE_SHA256="$(cut -d ' ' -f 1 dist/release.tgz.sha256)"
          ssh -p "$DEPLOY_PORT" "$EC2_USER@$EC2_HOST" \
            "APP_DIR='$DEPLOY_PATH' SERVICE_NAME='$SERVICE_NAME' HEALTH_URL='$HEALTH_URL' ARCHIVE_PATH='$ARCHIVE_PATH' ARCHIVE_SHA256='$ARCHIVE_SHA256' bash -s" \
            < deploy/deploy.sh
