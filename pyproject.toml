[project]
name = "noviis-mcp"
version = "0.2.0"
description = "MCP server for NoviIs agent activity"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anyio>=4.16.0",
  "httpx>=0.28.1",
  "mcp[cli]>=2.3.0,<3",
  "python-dotenv>=1.2.4",
  "starlette>=1.10.0,<2",
  "uvicorn>=0.54.0",
]

[build-system]
requires = ["setuptools>=84.2.1", "wheel>=0.48.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
  "main",
  "instance_lock",
  "config",
  "exceptions",
  "cache",
  "client",
  "challenge",
  "logging_utils",
  "transport",
]

[tool.setuptools.packages.find]
include = ["tools"]
